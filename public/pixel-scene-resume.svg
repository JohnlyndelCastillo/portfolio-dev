<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" shape-rendering="crispEdges">
  <!-- Small pixel-art resume folder scene; transparent background, no text. -->
  <g fill="#0F766E">
    <!-- folder -->
    <rect x="10" y="18" width="44" height="32" fill-opacity=".25"/><rect x="14" y="14" width="18" height="6" fill-opacity=".3"/>
    <!-- paper -->
    <rect x="16" y="22" width="32" height="24" fill="#F7F6F1"/><rect x="16" y="22" width="32" height="2" fill-opacity=".35"/>
    <!-- pixel list lines -->
    <rect x="20" y="28" width="6" height="2" fill-opacity=".45"/><rect x="29" y="28" width="15" height="2" fill-opacity=".35"/>
    <rect x="20" y="33" width="6" height="2" fill-opacity=".45"/><rect x="29" y="33" width="11" height="2" fill-opacity=".35"/>
    <rect x="20" y="38" width="6" height="2" fill-opacity=".45"/><rect x="29" y="38" width="14" height="2" fill-opacity=".35"/>
    <!-- check -->
    <rect x="20" y="43" width="2" height="2" fill="#6EE7B7"/><rect x="22" y="45" width="2" height="2" fill="#6EE7B7"/><rect x="24" y="43" width="2" height="2" fill="#6EE7B7"/><rect x="26" y="41" width="2" height="2" fill="#6EE7B7"/><rect x="29" y="43" width="13" height="2" fill-opacity=".35"/>
    <!-- sparkles -->
    <rect x="8" y="10" width="2" height="2" fill-opacity=".25"/><rect x="56" y="12" width="2" height="2" fill-opacity=".25"/>
    <rect x="8" y="56" width="2" height="2" fill-opacity=".22"/><rect x="56" y="56" width="2" height="2" fill-opacity=".22"/>
  </g>
</svg>
