<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" shape-rendering="crispEdges">
  <!-- Small pixel-art QA robot scene; transparent background, no text. -->
  <g fill="#0F766E">
    <!-- body -->
    <rect x="20" y="24" width="24" height="24" fill-opacity=".32"/>
    <!-- head -->
    <rect x="24" y="14" width="16" height="12" fill-opacity=".38"/>
    <!-- antenna -->
    <rect x="30" y="8" width="4" height="6" fill-opacity=".42"/><rect x="28" y="6" width="8" height="2" fill-opacity=".42"/>
    <!-- eyes -->
    <rect x="27" y="18" width="4" height="4" fill="#6EE7B7"/><rect x="33" y="18" width="4" height="4" fill="#6EE7B7"/>
    <!-- mouth -->
    <rect x="27" y="23" width="10" height="2" fill="#6EE7B7"/>
    <!-- arms -->
    <rect x="14" y="28" width="6" height="10" fill-opacity=".3"/><rect x="44" y="28" width="6" height="10" fill-opacity=".3"/>
    <!-- feet -->
    <rect x="22" y="48" width="6" height="4" fill-opacity=".3"/><rect x="36" y="48" width="6" height="4" fill-opacity=".3"/>
    <!-- check card -->
    <rect x="26" y="30" width="12" height="12" fill="#F7F6F1"/><rect x="28" y="36" width="3" height="3" fill="#6EE7B7"/><rect x="33" y="35" width="3" height="3" fill="#0F766E"/><rect x="38" y="34" width="3" height="3" fill="#6EE7B7"/>
    <!-- tiny pixel sparkles -->
    <rect x="8" y="12" width="2" height="2" fill-opacity=".25"/><rect x="54" y="14" width="2" height="2" fill-opacity=".25"/>
    <rect x="10" y="54" width="2" height="2" fill-opacity=".22"/><rect x="52" y="52" width="2" height="2" fill-opacity=".22"/>
  </g>
</svg>
